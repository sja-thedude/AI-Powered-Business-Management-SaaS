# NovaBiz AI — full production-shaped stack.
# Bring it up with:  docker compose up -d --build
# Then:             docker compose exec app php artisan migrate --seed
name: novabiz

services:
  # PHP-FPM application container (serves the Laravel app).
  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - storage:/var/www/html/storage
    networks: [novabiz]

  # Nginx front-end / reverse proxy to php-fpm.
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    networks: [novabiz]

  # PostgreSQL.
  pgsql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-novabiz}
      POSTGRES_USER: ${DB_USERNAME:-novabiz}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-novabiz}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [novabiz]

  # Redis (cache, sessions, queues, Horizon).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks: [novabiz]

  # Queue workers managed by Horizon (Redis-backed).
  horizon:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    command: php artisan horizon
    depends_on: [app, redis, pgsql]
    volumes:
      - storage:/var/www/html/storage
    networks: [novabiz]

  # Laravel Reverb WebSocket server (real-time).
  reverb:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on: [app, redis]
    ports:
      - "9090:8080"
    networks: [novabiz]

  # Scheduler (runs the Laravel scheduler every minute).
  scheduler:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    command: php artisan schedule:work
    depends_on: [app, pgsql, redis]
    volumes:
      - storage:/var/www/html/storage
    networks: [novabiz]

volumes:
  pgdata:
  redisdata:
  storage:

networks:
  novabiz:
    driver: bridge
